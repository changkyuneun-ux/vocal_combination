<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>실연자 앱 사용과 이의제기</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A1F68}a:hover{color:#5A1550}
.mono{font-family:'IBM Plex Mono',monospace}
.card{background:#FFFFFF;border:1px solid #E6DEE4;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}
.warn{background:#FDF0DC;color:#7A4105}.info{background:#E4EAFB;color:#1D3C99}
.btn{display:block;text-align:center;padding:11px;border-radius:10px;border:1px solid #CFC3CC;background:#FFFFFF;font-size:14px;font-weight:600;color:#1B1D21;font-family:inherit;min-height:44px;box-sizing:border-box;cursor:pointer;width:100%}
.tab{flex:1;text-align:center;font-size:12px;padding:10px 0;color:#4A4F59;text-decoration:none;min-height:44px;box-sizing:border-box}
.tab.on{color:#7A1F68;font-weight:700}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FAF6F9;font-family:'IBM Plex Sans KR',sans-serif;color:#1B1D21;display:flex;flex-direction:column">
  <header style="padding:20px 18px 12px;display:flex;justify-content:space-between;align-items:center">
    <div style="display:flex;flex-direction:column;gap:2px">
      <strong style="font-size:18px">정국</strong>
      <span style="font-size:12px;color:#4A4F59">본인 인증됨 · artist.dobedupop.localhost</span>
    </div>
    <a href="Main.dc.html" style="font-size:12px">구조 지도</a>
  </header>
  <main style="flex:1;overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px">
    <h1 style="margin:0;font-size:20px">내 목소리가 쓰인 조합</h1>
    <sc-for list="{{uses}}" as="u" hint-placeholder-count="3">
      <section class="card">
        <div style="display:flex;justify-content:space-between;gap:8px"><strong style="font-size:15px">{{u.title}}</strong><span class="mono" style="font-size:12px;color:#4A4F59">{{u.id}}</span></div>
        <div style="font-size:13px;color:#4A4F59">{{u.part}}</div>
      </section>
    </sc-for>
    <h2 style="margin:6px 0 0;font-size:17px">이의제기</h2>
    <section class="card">
      <div style="font-size:13px;line-height:1.6">나와 관련된 권리 주장(보이스 소유·스템 실연)이 틀렸으면 이의를 낸다. 이의가 열리면 곡의 팩이 일시정지되고 운영이 영향 범위를 본다.</div>
      <button class="btn" type="button">권리 주장 고르고 이의제기</button>
    </section>
    <h2 style="margin:6px 0 0;font-size:17px">알림</h2>
    <section class="card">
      <div style="display:flex;justify-content:space-between;gap:8px"><span class="badge info">사용</span><span style="font-size:12px;color:#4A4F59">3건</span></div>
      <div style="font-size:13px">새 조합에 내 목소리가 쓰였습니다(원곡 배치 · 맞바꾸기 · 보컬 멤버).</div>
    </section>
  </main>
  <nav aria-label="실연자 앱 탭" style="display:flex;border-top:1px solid #E6DEE4;background:#FFFFFF">
    <a class="tab" href="Artist-Consent.dc.html">동의</a>
    <a class="tab on" href="Artist-Usage.dc.html">사용</a>
    <a class="tab" href="Artist-Money.dc.html">수익</a>
    <a class="tab" href="Artist-Usage.dc.html">이의제기</a>
    <a class="tab" href="Artist-Usage.dc.html">알림</a>
  </nav>
</div>
</x-dc>

    };
  }
}
</script>
</body>
</html>
